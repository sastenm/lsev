[project]
name = "lsev-backend"
version = "0.1.0"
# ROS 2 Jazzy's rclpy is built for the system Python 3.12 on Ubuntu 24.04, so stay on 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
]

[tool.uv]
# This is an app, not a library: don't build or install the project itself.
package = false
# Never download a separate Python; use the system one so it matches ROS.
python-preference = "only-system"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]